[project]
name = "plantdb"
version = "0.1.0"
description = "Verified plant disease photo database and pipeline"
readme = "PROJECT.md"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0.30",
    "pydantic>=2.7.0",
    "alembic>=1.13.0",
    "pyyaml>=6.0.1",
    "pillow>=10.3.0",
    "imagehash>=4.3.1",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.setuptools.data-files]
"share/plantdb" = ["config/model_labels.json", "config/model_conditions.json", "config/taxonomy_seed.json"]
